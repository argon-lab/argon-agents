name: Publish Python package

on:
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - pyproject.toml
      - argon_agents/**
      - README.md
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example v0.2.0)"
        default: v0.2.0
        required: true
      probe_only:
        description: "Only check whether standard PyPI credentials are assigned; do not upload"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: python-publication-${{ inputs.tag || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify release tag is merged and matches package version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, re, subprocess, tomllib
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'Expected a stable version tag'
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert tag == 'v' + version, (tag, version)
          tag_commit = subprocess.check_output(['git', 'rev-parse', 'refs/tags/' + tag + '^{commit}'], text=True).strip()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert tag_commit == head, 'Checkout must match the tag, not a same-named branch'
          subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/main'], check=True)
          subprocess.run(['git', 'rev-parse', 'HEAD'], check=True)
          PY
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from importlib.metadata import version
          from argon_agents import ArgonClient, ArgonError, Sandbox, sandboxed_mem0_config
          print('Installed package version:', version('argon-agents'))
          print('Wheel imports verified outside the source checkout')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/argon-agents/
    permissions:
      id-token: write
    steps:
      - name: Report assigned credential availability without revealing values
        env:
          ASSIGNED_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN || secrets.TWINE_PASSWORD }}
        run: |
          if [ -n "$ASSIGNED_PYPI_TOKEN" ]; then
            echo 'A standard PyPI upload credential is assigned to this repository/environment.'
          else
            echo 'No standard PyPI upload credential is assigned to this job; publishing requires the configured trusted publisher.'
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish using assigned credentials or PyPI trusted publishing
        if: ${{ !inputs.probe_only }}
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          password: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN || secrets.TWINE_PASSWORD }}
