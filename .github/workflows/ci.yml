name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      engine_ref:
        description: "Exact engine SHA or release tag to verify"
        default: v2.1.3
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Test against the engine
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    env:
      ARGON_REQUIRE_STACK: '1'
      MEM0_TELEMETRY: 'false'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: argon-lab/argon
        ref: ${{ inputs.engine_ref || 'v2.1.3' }}
        path: engine

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.9'
        cache-dependency-path: |
          engine/go.sum
          engine/api/go.sum

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python }}

    - name: Start MongoDB (single-node replica set)
      run: |
        docker run -d --name ci-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
        for i in $(seq 1 30); do
          docker exec ci-mongo mongosh --quiet --eval 'db.runCommand({ping: 1})' && break
          sleep 1
        done
        docker exec ci-mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
        for i in $(seq 1 30); do
          [ "$(docker exec ci-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
          sleep 1
        done
        test "$(docker exec ci-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = true

    - name: Build and start the API server
      working-directory: engine/api
      run: |
        go build -o /tmp/argon-api .
        /tmp/argon-api &
        for i in $(seq 1 30); do
          curl -sf http://localhost:8080/health && break
          sleep 1
        done
        curl --fail http://localhost:8080/health
        git rev-parse HEAD

    - name: Install and test
      run: |
        pip install -e ".[dev]"
        pytest tests/ -v
